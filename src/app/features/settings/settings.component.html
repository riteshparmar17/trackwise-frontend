<ul class="nav nav-pills mb-4">
  <li class="nav-item">
    <button
      class="nav-link"
      [class.active]="activeTab === 'profile'"
      (click)="setTab('profile')"
    >
      Profile
    </button>
  </li>

  <li class="nav-item">
    <button
      class="nav-link"
      [class.active]="activeTab === 'lookups'"
      (click)="setTab('lookups')"
    >
      <i class="bi bi-gear me-2"></i>
      Lookup Lists
    </button>
  </li>
</ul>

<div *ngIf="activeTab === 'profile'">
  <app-profile-tab />
</div>

<div *ngIf="activeTab === 'lookups'">
  <div class="row g-4">
    <div class="col-lg-4">
      <app-lookup-section
        title="Drive Purposes"
        type="purpose"
        [refreshTrigger]="refreshTrigger"
        (deleteRequested)="onDeleteLookup($event)"
      />
    </div>

    <div class="col-lg-4">
      <app-lookup-section
        title="Expense Categories"
        type="category"
        [refreshTrigger]="refreshTrigger"
        (deleteRequested)="onDeleteLookup($event)"
      />
    </div>

    <div class="col-lg-4">
      <app-lookup-section
        title="Vendors"
        type="vendor"
        [refreshTrigger]="refreshTrigger"
        (deleteRequested)="onDeleteLookup($event)"
      />
    </div>
  </div>
</div>

<app-confirm-dialog
  modalId="deleteLookupModal"
  title="Delete Item"
  message="Are you sure you want to delete this item?"
  confirmText="Delete"
  cancelText="Cancel"
  confirmButtonClass="btn-danger"
  (onConfirm)="deleteLookup()"
>
</app-confirm-dialog>
