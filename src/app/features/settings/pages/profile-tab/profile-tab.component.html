<div class="card shadow-sm">
  <div class="card-body text-center">
    <h4 class="mt-3">
      {{ profileForm.get("name")?.value }}
    </h4>
    <p class="text-muted mb-0">
      {{ email }}
    </p>
  </div>
</div>

<div class="card mt-4">
  <div class="card-header">Profile</div>
  <div class="card-body">
    <div *ngIf="loading" class="text-muted">Loading...</div>
    <form *ngIf="!loading" [formGroup]="profileForm" (ngSubmit)="save()">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="name"
          [class.is-invalid]="
            profileForm.get('name')?.touched && profileForm.get('name')?.invalid
          "
          [class.is-valid]="
            profileForm.get('name')?.touched && profileForm.get('name')?.valid
          "
        />
        <div class="invalid-feedback">Name is required</div>
      </div>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="profileForm.invalid || !hasChanges()"
      >
        {{ saving ? "Updating..." : "Update Profile" }}
      </button>
    </form>
  </div>
</div>

<div class="card mt-4">
  <div class="card-header">Security</div>
  <div class="card-body">
    <p class="text-muted">Change your password at any time.</p>

    <form [formGroup]="changePasswordForm">
      <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input
          type="password"
          formControlName="currentPassword"
          class="form-control"
          [class.is-invalid]="
            changePasswordForm.get('currentPassword')?.touched &&
            changePasswordForm.get('currentPassword')?.invalid
          "
          [class.is-valid]="
            changePasswordForm.get('currentPassword')?.touched &&
            changePasswordForm.get('currentPassword')?.valid
          "
          placeholder="Current Password"
        />
        <div class="invalid-feedback">Current password is required.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <div class="input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="newPassword"
            class="form-control"
            [class.is-invalid]="
              changePasswordForm.get('newPassword')?.touched &&
              changePasswordForm.get('newPassword')?.invalid
            "
            [class.is-valid]="
              changePasswordForm.get('newPassword')?.touched &&
              changePasswordForm.get('newPassword')?.valid
            "
            placeholder="New Password"
          />
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="showPassword = !showPassword"
            tabindex="-1"
          >
            {{ showPassword ? "🙈" : "👁️" }}
          </button>
        </div>
        <div class="invalid-feedback">New password is required.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input
          type="password"
          formControlName="confirmPassword"
          class="form-control"
          placeholder="Confirm Password"
          [class.is-invalid]="
            (changePasswordForm.get('confirmPassword')?.touched &&
              changePasswordForm.get('confirmPassword')?.invalid) ||
            (changePasswordForm.get('confirmPassword')?.touched &&
              changePasswordForm.errors?.['mismatch'])
          "
          [class.is-valid]="
            changePasswordForm.get('confirmPassword')?.touched &&
            changePasswordForm.get('confirmPassword')?.valid
          "
        />

        <div class="invalid-feedback text-danger small">
          <span
            *ngIf="
              changePasswordForm.get('confirmPassword')?.errors?.['required']
            "
            >Confirm password is required.
          </span>
          <span
            *ngIf="
              changePasswordForm.get('confirmPassword')?.errors?.['mismatch']
            "
            >Passwords do not match.
          </span>
        </div>
      </div>
      <button
        type="button"
        class="btn btn-primary mb-3"
        (click)="updatePassword()"
        [disabled]="changePasswordForm.invalid"
      >
        Update Password
      </button>
    </form>
  </div>
</div>
